name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '17' ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify public source identity
        run: ./scripts/verify-public-source.sh
      - name: Verify reactor and coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify dependency declarations
        if: ${{ matrix.java == '17' }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress dependency:analyze
          -DfailOnWarning=true

  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: indexsmith-client-es7
            property: indexsmith.test.es7.image
            image: docker.elastic.co/elasticsearch/elasticsearch:7.11.0
          - module: indexsmith-client-es7
            property: indexsmith.test.es7.image
            image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
          - module: indexsmith-client-es8
            property: indexsmith.test.es8.image
            image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify adapter compatibility
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl ${{ matrix.module }} -am verify -Pintegration-tests
          -D${{ matrix.property }}=${{ matrix.image }}

  generated-repositories:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify generated repositories against ES7 and ES8
        run: ./mvnw --batch-mode --no-transfer-progress -pl indexsmith-generator -am verify -Pintegration-tests

  consumers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install reactor for isolated consumers
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      - name: Compile plain Java consumer
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/plain-java/pom.xml package
      - name: Compile Spring Boot 2.7 consumer
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/spring-boot-2/pom.xml package
      - name: Compile generated-source consumer
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/generated-consumer/pom.xml package
      - name: Compile runnable quickstart
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/quickstart/pom.xml package
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '7.6.4'
      - name: Resolve BOM and compile Gradle consumer
        run: gradle -p examples/gradle-consumer compileJava

  quickstart:
    needs: consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Elasticsearch and quickstart smoke test
        shell: bash
        run: |
          set -euo pipefail
          compose_file="examples/quickstart/compose.yaml"
          cleanup() {
            docker compose -f "$compose_file" down --volumes
          }
          trap cleanup EXIT
          docker compose -f "$compose_file" up --detach --build
          for attempt in {1..90}; do
            if response="$(curl --noproxy '*' --fail --silent --show-error \
                --connect-timeout 2 --max-time 5 \
                'http://127.0.0.1:18080/products?name=city%20bike')"; then
              if grep -Eq '"adapter"[[:space:]]*:[[:space:]]*"es8"' <<< "$response" \
                  && grep -Eq '"totalHits"[[:space:]]*:[[:space:]]*1' <<< "$response" \
                  && grep -Eq '"name"[[:space:]]*:[[:space:]]*"City Bike"' <<< "$response"; then
                echo "$response"
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose -f "$compose_file" ps
          docker compose -f "$compose_file" logs --no-color
          exit 1

  release-gate:
    if: ${{ always() }}
    needs:
      - verify
      - integration
      - generated-repositories
      - consumers
      - quickstart
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-relevant CI job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GENERATED_RESULT: ${{ needs.generated-repositories.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
          QUICKSTART_RESULT: ${{ needs.quickstart.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$GENERATED_RESULT" = success
          test "$CONSUMERS_RESULT" = success
          test "$QUICKSTART_RESULT" = success
